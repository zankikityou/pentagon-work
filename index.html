<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="description" content="気がかりを5つの視点から見つめる、自分用のペンタゴンワーク" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>ペンタゴンワーク</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">MY REFLECTIONS</p><h1>ペンタゴンワーク</h1></div>
      <button id="privacyToggle" class="icon-button" type="button" aria-label="内容を隠す">隠す</button>
    </header>
    <div id="installBanner" class="install-banner hidden"><span>ホーム画面に追加すると、アプリのようにすぐ開けます。</span><button id="installBtn" class="secondary" type="button">追加</button><button id="dismissInstall" class="close-button" type="button" aria-label="閉じる">×</button></div>

    <section id="homeView" class="view">
      <div class="hero-card"><p class="eyebrow">ひとつずつ、考えをほどく</p><h2>気がかりを、5つの視点から見つめる。</h2><p>書いた内容はこのブラウザだけに保存されます。</p><button id="newWorkBtn" class="primary wide" type="button">新しいワークを始める</button></div>
      <div class="section-heading"><h2>過去の記録</h2><span id="recordCount"></span></div>
      <div id="recordList" class="record-list"></div>
      <button id="graveyardBtn" class="secondary wide-section-button" type="button">悩みの墓場を見る</button>
      <div class="backup-actions"><button id="exportBtn" class="text-button" type="button">バックアップを書き出す</button><label class="text-button file-label">バックアップを読み込む<input id="importInput" type="file" accept="application/json" /></label></div>
    </section>

    <section id="editorView" class="view hidden">
      <div class="progress"><span id="progressText"></span><div class="progress-track"><i id="progressBar"></i></div></div>
      <form id="workForm" novalidate>
        <div id="stepContent"></div>
        <div class="form-actions"><button id="backBtn" class="secondary" type="button">戻る</button><button id="nextBtn" class="primary" type="button">次へ</button></div>
      </form>
    </section>

    <section id="detailView" class="view hidden"><button id="detailBackBtn" class="back-link" type="button">← 一覧に戻る</button><div id="detailContent"></div><div id="followUpPanel"></div><button id="deleteBtn" class="danger" type="button">この記録を削除</button></section>
    <section id="graveyardView" class="view hidden"><button id="graveyardBackBtn" class="back-link" type="button">← 一覧に戻る</button><p class="eyebrow">PAST WORRIES</p><h2>悩みの墓場</h2><p class="graveyard-intro">これまで成仏した悩み：<strong id="graveyardCount">0</strong>件</p><div id="graveyardList" class="record-list"></div></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
